name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (typecheck + tests)
    runs-on: ubuntu-latest
    env:
      # Dummy values so config validation passes; tests do not connect to real services.
      NODE_ENV: test
      POSTGRES_URL: postgres://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-jwt-secret-value
      JWT_REFRESH_SECRET: ci-only-refresh-secret-value
      ADMIN_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck --workspace @security-ai-lab/backend
      - run: npm test --workspace @security-ai-lab/backend
